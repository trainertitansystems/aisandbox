name: build-scan-push

on:
  push:
    # Triggers on push to any branch EXCEPT main (e.g., dev, feature/xyz, temp-branch)
    branches-ignore:
      - 'main'

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  GCP_PROJECT_ID: 'siem-486017'
  GAR_LOCATION: 'us-central1'
  GAR_REPOSITORY: 'my-platform-repo'
  IMAGE_NAME: 'app'
  WIF_PROVIDER: 'projects/464753796348/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  WIF_SERVICE_ACCOUNT: 'github-actions-sa@siem-486017.iam.gserviceaccount.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      # 2. Authenticate Docker with Google Artifact Registry
      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: 'oauth2accesstoken'
          password: ${{ steps.auth.outputs.access_token }}

      # 3. Build Docker Image
      - name: Build image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # 4. Security Scan with Trivy (@master branch reference)
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

      # 5. Push Image to GAR
      - name: Push image
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. Raise a Pull Request to merge the temp/feature branch into `main`
      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists from current branch to main
          EXISTING_PR=$(gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "Automated Build: Merge ${{ github.ref_name }} into main" \
              --body "Automated PR created following successful build, Trivy scan, and GAR push for commit \`${{ github.sha }}\`."
          else
            echo "Pull request already exists for this branch: PR #${EXISTING_PR}"
          fi
